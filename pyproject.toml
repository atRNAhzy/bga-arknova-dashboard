[project]
name = "bga-arknova-dashboard"
version = "0.1.0"
description = "BGA Ark Nova arena history scraper and interactive dashboard"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "pandas>=2.2",
  "plotly>=5.24",
  "playwright>=1.49",
  "streamlit>=1.41",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/atRNAhzy/bga-arknova-dashboard"
Repository = "https://github.com/atRNAhzy/bga-arknova-dashboard"
Issues = "https://github.com/atRNAhzy/bga-arknova-dashboard/issues"

[project.scripts]
bga-arknova = "bga_arknova.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

